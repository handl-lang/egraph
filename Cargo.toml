[package]
name = "handl-egraph"
version = "0.1.0"
edition = "2024"
description = "Generic e-graph / equality-saturation substrate over the kernel's `Term`/`Value` — the named Rust port of catopt-core's proven e-graph spec."
license = "MIT"
repository = "https://github.com/handl-lang/egraph"

# handl deps float on `main` (git). Local development resolves them to
# sibling checkouts via `source ~/.cache/devin/handl_deps.env` (git
# insteadOf) or the `[patch]` tables below — the handl-lang convention.
[dependencies]
# engine — the arrow-calculus `Term` kernel (ADR-0104b)
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
# kernel — the `Language` data schema + the tagged value layer
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

[dev-dependencies]
serde_json = "1"

# dev-link: begin
[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }
[patch."https://github.com/handl-lang/host"]
handl = { path = "../host" }
handl-bench = { path = "../host/crates/bench" }
handl-ext-tests = { path = "../host/crates/ext-tests" }
